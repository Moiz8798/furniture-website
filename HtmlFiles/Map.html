<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map - Peshawar (English)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map {
            height: 500px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <h2>Our Furniture Store in Peshawar</h2>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([34.0151, 71.5249], 12);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.carto.com">Carto</a>'
}).addTo(map);

        L.marker([34.0151, 71.5249]).addTo(map)
            .bindPopup("<b>Our Furniture Store</b><br>Peshawar, Pakistan")
            .openPopup();

            L.marker([34.0200, 71.5300]).addTo(map)
    .bindPopup("Another Furniture Store in Peshawar");



    </script>

</body>
</html>
